{% extends "base.html" %}
{% block content %}
<div class="bg-white rounded-2xl shadow p-6 md:p-8 max-w-3xl mx-auto">
  <h1 class="text-2xl font-bold text-blue-900 mb-4">📊 Hasil Analisis Awal</h1>
  {% if error %}
  <div class="bg-red-50 border border-red-300 text-red-700 px-4 py-3 rounded-lg mb-4 text-sm">{{ error }}</div>
  {% endif %}
  <div class="mb-6 p-4 bg-blue-50 rounded-lg">
    <p class="text-sm text-blue-800 font-medium">Nama Siswa:</p>
    <p class="text-xl font-semibold text-blue-900">{{ nama }}</p>
  </div>
  <div class="prose max-w-none mb-6 p-4 border border-gray-200 rounded-lg">
    <h3 class="text-lg font-semibold text-gray-800 mb-2">Analisis Tren Nilai</h3>
    <div class="text-gray-700 whitespace-pre-line text-sm">{{ analisis }}</div>
  </div>

  <details class="mb-6">
    <summary class="cursor-pointer text-sm text-blue-600">🔍 Lihat teks gabungan (debug)</summary>
    <pre class="mt-2 p-3 bg-gray-100 rounded text-xs overflow-x-auto max-h-60">{{ debug_text }}</pre>
    <p class="text-xs text-gray-500 mt-1">Jumlah file: {{ file_count }}</p>
  </details>

  <form method="POST" action="/analyze-step2" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Deskripsi Singkat Perilaku di Kelas</label>
      <textarea name="deskripsi" maxlength="1000" rows="5" required
                class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-400 text-sm"
                placeholder="Contoh: Siswa aktif bertanya..."></textarea>
      <p class="text-xs text-gray-400 mt-1">Maksimal 1000 karakter</p>
    </div>
    <button type="submit" id="mergeBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-3 rounded-lg transition flex items-center justify-center">
      <span id="btnText2">Gabungkan & Buat Deskripsi Lengkap</span>
      <span id="spinner2" class="hidden ml-2">
        <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
      </span>
    </button>
  </form>
</div>
<script>
  document.querySelector('form[action="/analyze-step2"]').addEventListener('submit', function(){
    document.getElementById('btnText2').classList.add('hidden');
    document.getElementById('spinner2').classList.remove('hidden');
    document.getElementById('mergeBtn').disabled = true;
  });
</script>
{% endblock %}
