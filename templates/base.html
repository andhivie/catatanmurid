<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catatan Perkembangan Murid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Poppins', sans-serif; background: #f0f7ff; } </style>
</head>
<body class="min-h-screen flex flex-col">
  <nav class="bg-white shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="/" class="text-2xl font-semibold text-blue-800">✨ Catatan Murid</a>
      <a href="/upload" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">+ Buat Laporan Baru</a>
    </div>
  </nav>
  
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="max-w-4xl mx-auto px-4 mt-4">
        {% for category, message in messages %}
          <div class="p-3 rounded-lg text-sm mb-2 {% if category == 'success' %}bg-green-100 text-green-800{% else %}bg-red-100 text-red-800{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <main class="flex-grow container mx-auto max-w-4xl px-4 py-8">
    {% block content %}{% endblock %}
  </main>
  <footer class="text-center text-gray-500 text-sm py-4 border-t">
    © 2025 Andhivi – Aplikasi lokal
  </footer>
</body>
</html>
